<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 GitLike CDN - النظام المتكامل</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;padding:15px;direction:rtl}
.container{max-width:1400px;margin:0 auto}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;background:rgba(255,255,255,0.03);padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:20px;background:linear-gradient(135deg,#00d4aa,#00a884);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .admin-name{color:#ffd700;font-size:12px}
.header-controls{display:flex;gap:6px;flex-wrap:wrap}
.header-controls button{padding:4px 12px;border:1px solid rgba(0,212,170,0.3);border-radius:6px;background:rgba(0,212,170,0.1);color:#00d4aa;cursor:pointer;font-size:10px;transition:all .3s;font-family:inherit}
.header-controls button:hover{background:rgba(0,212,170,0.25);transform:translateY(-2px)}
.header-controls .btn-success{border-color:rgba(74,222,128,0.3);color:#4ade80}
.header-controls .btn-success:hover{background:rgba(74,222,128,0.2)}
.header-controls .btn-danger{border-color:rgba(239,68,68,0.3);color:#f87171}
.header-controls .btn-danger:hover{background:rgba(239,68,68,0.2)}
.header-controls .btn-gold{border-color:rgba(255,215,0,0.3);color:#ffd700}
.header-controls .btn-gold:hover{background:rgba(255,215,0,0.2)}

#auth-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.95);display:flex;justify-content:center;align-items:center;flex-direction:column;backdrop-filter:blur(20px)}
#auth-overlay .auth-box{background:rgba(10,10,30,0.97);border:2px solid rgba(255,215,0,0.3);border-radius:20px;padding:32px;width:90%;max-width:380px}
#auth-overlay .auth-box h2{color:#ffd700;text-align:center;font-size:22px;margin-bottom:20px}
#auth-overlay .auth-box .field{margin-bottom:14px}
#auth-overlay .auth-box .field label{color:#888;font-size:11px;display:block;margin-bottom:4px;font-weight:600}
#auth-overlay .auth-box .field input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff;font-size:14px;font-family:inherit}
#auth-overlay .auth-box .field input:focus{outline:none;border-color:rgba(255,215,0,0.4)}
#auth-overlay .auth-box .auth-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:all .3s;margin-top:4px}
#auth-overlay .auth-box .auth-btn.primary{background:linear-gradient(135deg,#ffd700,#f59e0b);color:#111}
#auth-overlay .auth-box .auth-btn.primary:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,215,0,0.3)}
#auth-overlay .auth-box .auth-error{color:#ef4444;font-size:11px;text-align:center;margin-top:8px;display:none}
#auth-overlay .auth-box .auth-info{color:#666;font-size:11px;text-align:center;margin-top:12px;padding:8px;background:rgba(255,215,0,0.05);border-radius:8px;border:1px solid rgba(255,215,0,0.08)}

.git-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.git-stat-box{background:rgba(0,212,170,0.05);border:1px solid rgba(0,212,170,0.15);border-radius:8px;padding:10px;text-align:center}
.git-stat-box .num{font-size:20px;font-weight:800;display:block;color:#00d4aa}
.git-stat-box .label{font-size:9px;color:#888;margin-top:2px;display:block}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-bottom:12px}
.tile{aspect-ratio:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:3px;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:7px;padding:1px;position:relative;min-height:30px}
.tile:hover{background:rgba(0,212,170,0.15);border-color:rgba(0,212,170,0.4);transform:scale(1.05);z-index:10}
.tile .icon{font-size:14px}
.tile .label{color:#888;font-size:5px}
.tile .status{font-size:5px;margin-top:1px}
.tile .status.online{color:#4ade80}
.tile .status.offline{color:#666}
.tile.has-files{border-color:rgba(0,212,170,0.3);background:rgba(0,212,170,0.08)}
.tile.protected{border-color:rgba(74,222,128,0.4);box-shadow:0 0 10px rgba(74,222,128,0.1)}
.tile .badge{position:absolute;top:-2px;right:-2px;background:#00d4aa;color:#fff;font-size:5px;padding:1px 3px;border-radius:4px;font-weight:700}
.tile .sync-badge{position:absolute;bottom:-2px;right:-2px;background:rgba(0,212,170,0.8);color:#fff;font-size:4px;padding:1px 3px;border-radius:3px}

.git-panel{background:rgba(0,212,170,0.03);border:1px solid rgba(0,212,170,0.15);border-radius:12px;padding:16px;margin-bottom:12px;display:none}
.git-panel.open{display:block}
.git-panel .git-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.git-panel .git-header h3{color:#00d4aa;font-size:16px}
.git-panel .git-header button{background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px}
.git-panel .git-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.git-panel .git-row input,.git-panel .git-row textarea{flex:1;min-width:100px;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#fff;font-size:11px;font-family:inherit}
.git-panel .git-row input:focus,.git-panel .git-row textarea:focus{outline:none;border-color:rgba(0,212,170,0.4)}
.git-panel .git-row textarea{min-height:60px;font-family:'Courier New',monospace;direction:ltr;text-align:left}
.git-panel .git-row button{padding:6px 16px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.git-panel .git-row .btn-primary{background:rgba(0,212,170,0.2);color:#00d4aa;border:1px solid rgba(0,212,170,0.3)}
.git-panel .git-row .btn-primary:hover{background:rgba(0,212,170,0.3)}
.git-panel .git-row .btn-success{background:rgba(74,222,128,0.2);color:#4ade80;border:1px solid rgba(74,222,128,0.3)}
.git-panel .git-row .btn-success:hover{background:rgba(74,222,128,0.3)}
.git-panel .git-row .btn-danger{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.git-panel .git-row .btn-danger:hover{background:rgba(239,68,68,0.3)}
.git-panel .git-row .btn-gold{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid rgba(255,215,0,0.3)}
.git-panel .git-row .btn-gold:hover{background:rgba(255,215,0,0.3)}
.git-file-list{max-height:200px;overflow-y:auto;margin-top:8px}
.git-file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:4px;margin-bottom:3px;font-size:11px}
.git-file-item .name{color:#00d4aa;font-weight:600}
.git-file-item .size{color:#666;font-size:9px}
.git-file-item .actions button{background:none;border:none;color:#888;cursor:pointer;font-size:12px;padding:0 4px}
.git-file-item .actions button:hover{color:#fff}
.git-file-item .actions .delete:hover{color:#f87171}
.git-file-item .actions .edit:hover{color:#fbbf24}
.history-list{max-height:150px;overflow-y:auto;margin-top:8px}
.history-item{display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,255,255,0.02);border-radius:3px;margin-bottom:2px;font-size:10px;color:#888}
.history-item .action.add{color:#4ade80}
.history-item .action.update{color:#fbbf24}
.history-item .action.delete{color:#f87171}
.history-item .time{color:#666;font-size:8px}

.tile-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.97);border:1px solid rgba(0,212,170,0.3);border-radius:12px;padding:16px;width:92%;max-width:520px;max-height:80vh;overflow-y:auto;z-index:9999;backdrop-filter:blur(20px);display:none;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.tile-panel.open{display:block}
.tile-panel .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:8px}
.tile-panel .panel-header h3{color:#00d4aa;font-size:14px}
.tile-panel .panel-header button{background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.tile-panel .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-bottom:8px}
.tile-panel .info-item{display:flex;justify-content:space-between;padding:2px 0;font-size:10px;color:#888;border-bottom:1px solid rgba(255,255,255,0.03)}
.tile-panel .info-item .value{color:#fff}
.tile-panel .info-item .value.online{color:#4ade80}
.tile-panel .info-item .value.offline{color:#f87171}
.tile-panel .file-list{margin:8px 0;max-height:150px;overflow-y:auto}
.tile-panel .file-item{display:flex;justify-content:space-between;align-items:center;padding:3px 6px;background:rgba(255,255,255,0.03);border-radius:3px;margin-bottom:2px;font-size:9px}
.tile-panel .file-item .name{color:#00d4aa;font-weight:600}
.tile-panel .file-item .size{color:#666;font-size:7px}
.tile-panel .file-item .actions button{background:none;border:none;color:#888;cursor:pointer;font-size:10px;padding:0 2px}
.tile-panel .file-item .actions button:hover{color:#fff}
.tile-panel .file-item .actions .delete:hover{color:#f87171}
.tile-panel .file-item .actions .edit:hover{color:#fbbf24}
.tile-panel .actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.tile-panel .actions button{padding:4px 10px;border:none;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.tile-panel .actions button:hover{transform:scale(1.03)}
.tile-panel .actions .btn-upload{background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2)}
.tile-panel .actions .btn-protect{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.2)}
.tile-panel .actions .btn-delete{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.2)}
.tile-panel .actions .btn-sync{background:rgba(0,212,170,0.15);color:#00d4aa;border:1px solid rgba(0,212,170,0.2);grid-column:span 2}

.file-editor{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.97);border:1px solid rgba(0,212,170,0.3);border-radius:12px;padding:16px;width:92%;max-width:600px;max-height:80vh;z-index:99999;display:none;backdrop-filter:blur(20px)}
.file-editor.open{display:block}
.file-editor .editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.file-editor .editor-header h4{color:#00d4aa;font-size:12px}
.file-editor .editor-header button{background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:11px}
.file-editor textarea{width:100%;height:200px;background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:8px;font-family:'Courier New',monospace;font-size:10px;resize:vertical;direction:ltr;text-align:left}
.file-editor .editor-actions{display:flex;gap:6px;margin-top:8px}
.file-editor .editor-actions button{padding:4px 12px;border:none;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;flex:1}
.file-editor .editor-actions .btn-save{background:rgba(0,212,170,0.2);color:#00d4aa;border:1px solid rgba(0,212,170,0.2)}
.file-editor .editor-actions .btn-close{background:rgba(255,255,255,0.06);color:#888;border:none}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,30,0.95);color:#fff;padding:6px 16px;border-radius:6px;border:1px solid rgba(0,212,170,0.2);z-index:999999;font-size:11px;display:none;animation:fadeIn .3s ease;max-width:90%;text-align:center}
.toast.success{border-color:rgba(74,222,128,0.3)}
.toast.error{border-color:rgba(239,68,68,0.3)}
.toast.warning{border-color:rgba(251,191,36,0.3)}
.toast.git{border-color:rgba(0,212,170,0.3)}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a6a}

@media(max-width:768px){
    .grid{gap:1px}
    .tile{min-height:25px;font-size:6px}
    .tile .icon{font-size:10px}
    .git-stats{grid-template-columns:repeat(3,1fr)}
    .header h1{font-size:16px}
    .header-controls button{font-size:8px;padding:3px 8px}
}
@media(max-width:480px){
    .grid{gap:1px}
    .tile{min-height:20px;border-radius:2px}
    .tile .icon{font-size:8px}
    .tile .label{font-size:4px}
    .git-stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ====== المصادقة ====== -->
<div id="auth-overlay">
    <div class="auth-box">
        <h2>👑 دخول المدير</h2>
        <div class="field"><label>👤 اسم المستخدم</label><input type="text" id="admin-username" value="admin"></div>
        <div class="field"><label>🔑 كلمة المرور</label><input type="password" id="admin-password" value="admin123" onkeydown="if(event.key==='Enter')adminLogin()"></div>
        <div class="auth-error" id="auth-error"></div>
        <button class="auth-btn primary" onclick="adminLogin()">🚀 دخول</button>
        <div class="auth-info">🔐 admin / admin123 | 📦 GitLike CDN</div>
    </div>
</div>

<!-- ====== لوحة التحكم ====== -->
<div id="admin-container" style="display:none;">
    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <div><h1>📦 GitLike CDN</h1><span class="admin-name">المدير: <span id="admin-name-display">مدير</span></span></div>
            <div class="header-controls">
                <button class="btn-gold" onclick="toggleGitPanel()">📦 المستودع</button>
                <button class="btn-success" onclick="syncAllFromChannel()">🔄 مزامنة</button>
                <button onclick="exportAllTiles()">📤 تصدير</button>
                <button onclick="document.getElementById('importFile').click()">📥 استيراد</button>
                <button class="btn-danger" onclick="resetAll()">🔄 إعادة تعيين</button>
                <button class="btn-danger" onclick="logoutAdmin()">🚪 خروج</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllTiles(event)">
            </div>
        </div>

        <!-- إحصائيات -->
        <div class="git-stats" id="gitStats">
            <div class="git-stat-box"><span class="num" id="gitFilesCount">0</span><span class="label">📄 ملفات</span></div>
            <div class="git-stat-box"><span class="num" id="gitCommitsCount">0</span><span class="label">📝 التزامات</span></div>
            <div class="git-stat-box"><span class="num" id="gitBranchesCount">1</span><span class="label">🌿 فروع</span></div>
            <div class="git-stat-box"><span class="num" id="gitSizeCount">0</span><span class="label">💾 الحجم</span></div>
            <div class="git-stat-box"><span class="num" id="gitGistCount">0</span><span class="label">📦 Gist</span></div>
            <div class="git-stat-box"><span class="num" id="gitOnlineCount">0</span><span class="label">🟢 نشطة</span></div>
        </div>

        <!-- لوحة Git -->
        <div class="git-panel" id="gitPanel">
            <div class="git-header">
                <h3>📦 مستودع GitLike</h3>
                <button onclick="toggleGitPanel()">✖</button>
            </div>
            
            <!-- الأزرار -->
            <div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">
                <button onclick="gitShowTab('files')" class="btn-primary" style="padding:4px 12px;border:none;border-radius:4px;background:rgba(0,212,170,0.2);color:#00d4aa;cursor:pointer;font-size:10px;font-family:inherit;" id="gitTabFilesBtn">📁 الملفات</button>
                <button onclick="gitShowTab('history')" style="padding:4px 12px;border:none;border-radius:4px;background:rgba(255,255,255,0.05);color:#888;cursor:pointer;font-size:10px;font-family:inherit;" id="gitTabHistoryBtn">📝 السجل</button>
                <button onclick="gitShowTab('gist')" style="padding:4px 12px;border:none;border-radius:4px;background:rgba(255,255,255,0.05);color:#888;cursor:pointer;font-size:10px;font-family:inherit;" id="gitTabGistBtn">📦 Gist</button>
            </div>

            <!-- تبويب الملفات -->
            <div id="gitTabFiles">
                <div class="git-row">
                    <input type="text" id="gitNewFileName" placeholder="اسم الملف (مثال: index.html)" style="flex:2;">
                    <input type="text" id="gitNewFileContent" placeholder="محتوى الملف" style="flex:3;">
                    <button class="btn-success" onclick="gitAddFile()">➕ إضافة</button>
                </div>
                <div class="git-file-list" id="gitFileList">
                    <div style="text-align:center;color:#666;padding:20px;font-size:12px;">📭 لا توجد ملفات</div>
                </div>
            </div>

            <!-- تبويب السجل -->
            <div id="gitTabHistory" style="display:none;">
                <div class="history-list" id="gitHistoryList">
                    <div style="text-align:center;color:#666;padding:20px;font-size:12px;">📝 لا توجد تغييرات</div>
                </div>
                <button class="btn-danger" onclick="gitClearHistory()" style="margin-top:8px;padding:4px 12px;border:none;border-radius:4px;background:rgba(239,68,68,0.2);color:#f87171;cursor:pointer;font-size:10px;font-family:inherit;">🗑️ مسح السجل</button>
            </div>

            <!-- تبويب Gist -->
            <div id="gitTabGist" style="display:none;">
                <div class="git-row">
                    <input type="text" id="gitGistToken" placeholder="GitHub Token" style="flex:2;">
                    <input type="text" id="gitGistId" placeholder="Gist ID" style="flex:1;">
                    <button class="btn-gold" onclick="gitSaveGist()">💾 حفظ</button>
                </div>
                <div class="git-row">
                    <button class="btn-gold" onclick="gitPushToGist()">📤 رفع إلى Gist</button>
                    <button class="btn-success" onclick="gitPullFromGist()">📥 جلب من Gist</button>
                    <button class="btn-primary" onclick="gitListGist()">📋 قائمة</button>
                </div>
                <div id="gitGistResult" style="margin-top:8px;font-size:11px;color:#888;"></div>
            </div>
        </div>

        <!-- الشبكة -->
        <div class="grid" id="grid"></div>
    </div>
</div>

<!-- ====== لوحة المربع ====== -->
<div class="tile-panel" id="tilePanel">
    <div class="panel-header"><h3 id="panelTitle">📦 المربع</h3><button onclick="closePanel()">✖</button></div>
    <div class="info-grid">
        <div class="info-item"><span>📍 الموقع</span><span class="value" id="panelLocation">(0,0)</span></div>
        <div class="info-item"><span>🔄 الحالة</span><span class="value offline" id="panelStatus">⚪ غير نشط</span></div>
        <div class="info-item"><span>🛡️ الحماية</span><span class="value" id="panelProtected">❌</span></div>
        <div class="info-item"><span>📄 الملفات</span><span class="value" id="panelFileCount">0</span></div>
        <div class="info-item"><span>🔄 المزامنة</span><span class="value" id="panelSync">❌</span></div>
        <div class="info-item"><span>📦 Gist</span><span class="value" id="panelGist">❌</span></div>
    </div>
    <div class="file-list" id="panelFiles"></div>
    <div class="actions">
        <button class="btn-upload" onclick="uploadFile()">📤 رفع</button>
        <button class="btn-protect" onclick="toggleProtect()" id="panelProtectBtn">🛡️ حماية</button>
        <button class="btn-delete" onclick="clearTile()">🗑️ تفريغ</button>
        <button class="btn-sync" onclick="syncTileToChannel()">🔄 مزامنة</button>
    </div>
</div>

<!-- ====== محرر الملفات ====== -->
<div class="file-editor" id="fileEditor">
    <div class="editor-header"><h4 id="editorTitle">📝 تحرير</h4><button onclick="closeEditor()">✖</button></div>
    <textarea id="editorContent" spellcheck="false"></textarea>
    <div class="editor-actions"><button class="btn-save" onclick="saveFile()">💾 حفظ</button><button class="btn-close" onclick="closeEditor()">✖ إلغاء</button></div>
</div>

<!-- ====== توست ====== -->
<div class="toast" id="toast"></div>

<!-- ============================================================ -->
<!-- جافا سكريبت - الكود الكامل 100%                              -->
<!-- ============================================================ -->
<script>
// ============================================================
// 🔐 المصادقة
// ============================================================
const ADMIN = { username: 'admin', password: 'admin123' };
let isAdmin = false;

function adminLogin() {
    const u = document.getElementById('admin-username').value.trim();
    const p = document.getElementById('admin-password').value.trim();

// 📦 GitRepo - نظام GitLike الكامل
// ============================================================
const GitRepo = {
    files: {},
    history: [],
    gistToken: '',
    gistId: '',

    init() {
        this.load();
        this.loadGistConfig();
        this.updateUI();
        console.log('📦 GitRepo جاهز');
    },

    load() {
        const data = localStorage.getItem('gitlike_repo');
        if (data) {
            try {
                const parsed = JSON.parse(data);
                this.files = parsed.files || {};
                this.history = parsed.history || [];
            } catch(e) {}
        }
    },

    save() {
        localStorage.setItem('gitlike_repo', JSON.stringify({
            files: this.files,
            history: this.history,
            savedAt: new Date().toISOString()
        }));
        this.updateUI();
    },

    loadGistConfig() {
        this.gistToken = localStorage.getItem('gitlike_gist_token') || '';
        this.gistId = localStorage.getItem('gitlike_gist_id') || '';
        document.getElementById('gitGistToken').value = this.gistToken;
        document.getElementById('gitGistId').value = this.gistId;
    },

    saveGistConfig(token, gistId) {
        this.gistToken = token;
        this.gistId = gistId || this.gistId;
        localStorage.setItem('gitlike_gist_token', token);
        if (gistId) localStorage.setItem('gitlike_gist_id', gistId);
        showToast('✅ تم حفظ إعدادات Gist', 'success');
    },

    addFile(path, content, msg = 'إضافة ملف') {
        if (!path) return showToast('❌ اسم الملف مطلوب', 'error');
        const isUpdate = !!this.files[path];
        this.files[path] = content || '';
        this.history.push({
            action: isUpdate ? 'update' : 'add',
            path: path,
            message: msg || (isUpdate ? 'تحديث' : 'إضافة'),
            timestamp: new Date().toLocaleString('ar-SA'),
            size: (content || '').length
        });
        this.save();
        showToast(`✅ ${isUpdate ? 'تحديث' : 'إضافة'}: ${path}`, 'success');
        return true;
    },

    deleteFile(path) {
        if (!this.files[path]) return showToast('❌ الملف غير موجود', 'error');
        delete this.files[path];
        this.history.push({
            action: 'delete',
            path: path,
            message: 'حذف ملف',
            timestamp: new Date().toLocaleString('ar-SA')
        });
        this.save();
        showToast(`🗑️ حذف: ${path}`, 'warning');
        return true;
    },

    getFiles() { return Object.keys(this.files); },

    getHistory() { return this.history.slice(-50).reverse(); },

    getStats() {
        let size = 0;
        for (const c of Object.values(this.files)) size += c.length;
        return {
            files: Object.keys(this.files).length,
            size: size,
            formattedSize: this.formatSize(size),
            commits: this.history.length
        };
    },

    formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    },

    updateUI() {
        const stats = this.getStats();
        document.getElementById('gitFilesCount').textContent = stats.files;
        document.getElementById('gitCommitsCount').textContent = stats.commits;
        document.getElementById('gitBranchesCount').textContent = '1';
        document.getElementById('gitSizeCount').textContent = stats.formattedSize;
        document.getElementById('gitGistCount').textContent = this.gistId ? 1 : 0;
        document.getElementById('gitOnlineCount').textContent = ServerManager ? Object.keys(ServerManager.activeServers || {}).length : 0;
        this.renderFiles();
        this.renderHistory();
    },

    renderFiles() {
        const list = document.getElementById('gitFileList');
        const files = this.getFiles();
        if (files.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:12px;">📭 لا توجد ملفات</div>';
            return;
        }
        list.innerHTML = files.map(path => {
            const content = this.files[path];
            const size = this.formatSize(content ? content.length : 0);
            return `<div class="git-file-item">
                <span class="name">${path}</span>
                <span class="size">${size}</span>
                <span class="actions">
                    <button onclick="gitEditFile('${path}')" title="تحرير">✏️</button>
                    <button onclick="gitDownloadFile('${path}')" title="تحميل">⬇️</button>
                    <button class="delete" onclick="gitDeleteFile('${path}')" title="حذف">🗑️</button>
                </span>
            </div>`;
        }).join('');
    },

    renderHistory() {
        const list = document.getElementById('gitHistoryList');
        const history = this.getHistory();
        if (history.length === 0) {
            list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:12px;">📝 لا توجد تغييرات</div>';
            return;
        }
        list.innerHTML = history.map(h => `
            <div class="history-item">
                <span><span class="action ${h.action}">[${h.action}]</span> ${h.path} - ${h.message}</span>
                <span class="time">${h.timestamp}</span>
            </div>
        `).join('');
    },

    clearHistory() {
        if (!confirm('🗑️ مسح كل السجل؟')) return;
        this.history = [];
        this.save();
        showToast('🗑️ تم مسح السجل', 'warning');
    },

    // ====== Gist ======
    async pushToGist() {
        if (!this.gistToken) return showToast('⚠️ أدخل GitHub Token أولاً', 'warning');
        const data = {
            description: '📦 GitLike CDN Backup',
            public: false,
            files: {}
        };
        for (const [path, content] of Object.entries(this.files)) {
            data.files[path] = { content: content };
        }
        try {
            const url = this.gistId ? 
                `https://api.github.com/gists/${this.gistId}` :
                'https://api.github.com/gists';
            const method = this.gistId ? 'PATCH' : 'POST';
            const resp = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `token ${this.gistToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            if (result.id) {
                if (!this.gistId) {
                    this.gistId = result.id;
                    localStorage.setItem('gitlike_gist_id', result.id);
                }
                showToast(`✅ تم رفع ${Object.keys(this.files).length} ملف إلى Gist`, 'success');
                document.getElementById('gitGistResult').innerHTML = `✅ Gist ID: ${result.id}<br>🔗 ${result.html_url}`;
                this.updateUI();
            } else {
                showToast('❌ فشل الرفع: ' + (result.message || 'خطأ غير معروف'), 'error');
            }
        } catch(e) {
            showToast('❌ خطأ: ' + e.message, 'error');
        }
    },

    async pullFromGist() {
        if (!this.gistId) return showToast('⚠️ لا يوجد Gist ID', 'warning');
        try {
            const resp = await fetch(`https://api.github.com/gists/${this.gistId}`);
            const data = await resp.json();
            if (data.files) {
                let count = 0;
                for (const [path, file] of Object.entries(data.files)) {
                    this.files[path] = file.content || '';
                    count++;
                }
                this.save();
                showToast(`✅ تم جلب ${count} ملف من Gist`, 'success');
                this.updateUI();
            } else {
                showToast('❌ فشل الجلب', 'error');
            }
        } catch(e) {
            showToast('❌ خطأ: ' + e.message, 'error');
        }
    },

    async listGist() {
        if (!this.gistId) return showToast('⚠️ لا يوجد Gist ID', 'warning');
        try {
            const resp = await fetch(`https://api.github.com/gists/${this.gistId}`);
            const data = await resp.json();
            if (data.files) {
                const names = Object.keys(data.files);
                document.getElementById('gitGistResult').innerHTML = 
                    `📋 ${names.length} ملفات:<br>${names.map(n => `📄 ${n}`).join('<br>')}`;
            }
        } catch(e) {
            showToast('❌ خطأ: ' + e.message, 'error');
        }
    }
};

// 🗄️ ServerManager
// ============================================================
const ServerManager = {
    tiles: {},
    protectedTiles: new Set(),
    activeServers: new Set(),
    syncedTiles: new Set(),
    currentTile: null,
    currentFile: null,

    init() {
        this.loadTiles();
        this.renderGrid();
        this.updateStats();
        showToast('✅ جاهز', 'success');
    },

    loadTiles() {
        const saved = localStorage.getItem('cdn_tiles');
        if (saved) {
            try {
                this.tiles = JSON.parse(saved);
                const p = localStorage.getItem('cdn_protected');
                if (p) this.protectedTiles = new Set(JSON.parse(p));
                const s = localStorage.getItem('cdn_synced');
                if (s) this.syncedTiles = new Set(JSON.parse(s));
                return;
            } catch(e) {}
        }
        for (let r = 0; r < 12; r++) {
            for (let c = 0; c < 12; c++) {
                const id = r + '_' + c;
                this.tiles[id] = { id, row: r, col: c, files: {}, created: Date.now() };
            }
        }
        this.saveTiles();
    },

    saveTiles() {
        localStorage.setItem('cdn_tiles', JSON.stringify(this.tiles));
        localStorage.setItem('cdn_protected', JSON.stringify(Array.from(this.protectedTiles)));
        localStorage.setItem('cdn_synced', JSON.stringify(Array.from(this.syncedTiles)));
    },

    renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let r = 0; r < 12; r++) {
            for (let c = 0; c < 12; c++) {
                const id = r + '_' + c;
                const tile = this.tiles[id];
                if (!tile) continue;
                const isProtected = this.protectedTiles.has(id);
                const isActive = this.activeServers.has(id);
                const isSynced = this.syncedTiles.has(id);
                const fileCount = tile.files ? Object.keys(tile.files).length : 0;
                const div = document.createElement('div');
                div.className = 'tile';
                if (fileCount > 0) div.classList.add('has-files');
                if (isProtected) div.classList.add('protected');
                div.dataset.tile = id;
                let html = `<div class="icon">📦</div>`;
                html += `<div class="label">${r},${c}</div>`;
                html += `<div class="status ${isActive ? 'online' : 'offline'}">${isActive ? '🟢' : '⚪'}</div>`;
                if (fileCount > 0) html += `<div class="badge">${fileCount}</div>`;
                if (isSynced) html += `<div class="sync-badge">🔄</div>`;
                div.innerHTML = html;
                div.onclick = () => this.openPanel(id);
                grid.appendChild(div);
            }
        }
        this.updateStats();
    },

    updateStats() {
        let files = 0;
        for (const t of Object.values(this.tiles)) {
            if (t && t.files) files += Object.keys(t.files).length;
        }
        document.getElementById('gitOnlineCount').textContent = this.activeServers.size;
        GitRepo.updateUI();
    },

    openPanel(id) {
        if (!isAdmin) return;
        this.currentTile = id;
        const tile = this.tiles[id];
        if (!tile) return;
        const panel = document.getElementById('tilePanel');
        panel.classList.add('open');
        document.getElementById('panelTitle').textContent = `📦 المربع (${tile.row}, ${tile.col})`;
        document.getElementById('panelLocation').textContent = `(${tile.row}, ${tile.col})`;
        const isActive = this.activeServers.has(id);
        const st = document.getElementById('panelStatus');
        st.textContent = isActive ? '🟢 نشط' : '⚪ غير نشط';
        st.className = 'value ' + (isActive ? 'online' : 'offline');
        const isProtected = this.protectedTiles.has(id);
        document.getElementById('panelProtected').textContent = isProtected ? '✅' : '❌';
        document.getElementById('panelProtected').style.color = isProtected ? '#4ade80' : '#f87171';
        const isSynced = this.syncedTiles.has(id);
        document.getElementById('panelSync').textContent = isSynced ? '✅' : '❌';
        document.getElementById('panelSync').style.color = isSynced ? '#4ade80' : '#f87171';
        const hasGist = GitRepo.files && GitRepo.files[id + '_*'] ? true : false;
        document.getElementById('panelGist').textContent = hasGist ? '✅' : '❌';
        document.getElementById('panelGist').style.color = hasGist ? '#ffd700' : '#f87171';
        document.getElementById('panelProtectBtn').textContent = isProtected ? '🔓 إزالة' : '🛡️ حماية';
        this.renderFiles(tile);
        document.getElementById('panelFileCount').textContent = tile.files ? Object.keys(tile.files).length : 0;
    },

    renderFiles(tile) {
        const container = document.getElementById('panelFiles');
        container.innerHTML = '';
        if (!tile || !tile.files || Object.keys(tile.files).length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:10px;">📭 لا توجد ملفات</div>';
            return;
        }
        for (const [name, content] of Object.entries(tile.files)) {
            const div = document.createElement('div');
            div.className = 'file-item';
            const size = new Blob([content]).size;
            const sizeStr = size < 1024 ? size + 'B' : (size / 1024).toFixed(1) + 'KB';
            div.innerHTML = `
                <span class="name">${name}</span>
                <span class="size">${sizeStr}</span>
                <span class="actions">
                    <button class="edit" onclick="ServerManager.editFile('${tile.id}','${name}')">✏️</button>
                    <button onclick="ServerManager.downloadFile('${tile.id}','${name}')">⬇️</button>
                    <button class="delete" onclick="ServerManager.deleteFile('${tile.id}','${name}')">🗑️</button>
                </span>
            `;
            container.appendChild(div);
        }
    },

    editFile(tileId, fileName) {
        if (!isAdmin) return;
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        this.currentTile = tileId;
        this.currentFile = fileName;
        const editor = document.getElementById('fileEditor');
        editor.classList.add('open');
        document.getElementById('editorTitle').textContent = '📝 ' + fileName;
        document.getElementById('editorContent').value = tile.files[fileName];
        window._editTileId = tileId;
        window._editFileName = fileName;
    },

    saveFile() {
        if (!window._editTileId || !window._editFileName) return;
        const content = document.getElementById('editorContent').value;
        this.tiles[window._editTileId].files[window._editFileName] = content;
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.closeEditor();
        showToast('✅ تم الحفظ', 'success');
    },

    closeEditor() {
        document.getElementById('fileEditor').classList.remove('open');
        window._editTileId = null;
        window._editFileName = null;
    },

    downloadFile(tileId, fileName) {
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        const blob = new Blob([tile.files[fileName]], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    },

    deleteFile(tileId, fileName) {
        if (!confirm('🗑️ حذف ' + fileName + '؟')) return;
        const tile = this.tiles[tileId];
        if (tile && tile.files) {
            delete tile.files[fileName];
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.renderFiles(tile);
            showToast('🗑️ تم الحذف', 'warning');
        }
    },

    uploadFile() {
        if (!this.currentTile) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.onchange = (e) => {
            const files = e.target.files;
            let count = 0;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const tile = this.tiles[this.currentTile];
                    if (!tile.files) tile.files = {};
                    tile.files[file.name] = ev.target.result;
                    this.saveTiles();
                    this.renderGrid();
                    this.updateStats();
                    this.renderFiles(tile);
                    count++;
                    if (count === files.length) showToast('✅ تم رفع ' + count + ' ملف', 'success');
                };
                reader.readAsText(file);
            }
        };
        input.click();
    },

    toggleProtect() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.protectedTiles.has(id)) {
            this.protectedTiles.delete(id);
            showToast('🔓 تم الإزالة', 'warning');
        } else {
            this.protectedTiles.add(id);
            showToast('🛡️ تم التفعيل', 'success');
        }
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },

    clearTile() {
        if (!this.currentTile || !confirm('🗑️ تفريغ المربع؟')) return;
        const tile = this.tiles[this.currentTile];
        if (tile) {
            tile.files = {};
            this.activeServers.delete(this.currentTile);
            this.protectedTiles.delete(this.currentTile);
            this.syncedTiles.delete(this.currentTile);
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.openPanel(this.currentTile);
            showToast('🗑️ تم التفريغ', 'warning');
        }
    },

    syncTileToChannel: async function() {
        const token = localStorage.getItem('cdn_bot_token');
        const chatId = localStorage.getItem('cdn_chat_id');
        if (!token || !chatId) {
            showToast('⚠️ قم بإعداد القناة', 'warning');
            return;
        }
        if (!this.currentTile) return;
        const tile = this.tiles[this.currentTile];
        if (!tile || !tile.files || Object.keys(tile.files).length === 0) {
            showToast('❌ لا توجد ملفات', 'error');
            return;
        }
        let synced = 0;
        for (const [fileName, content] of Object.entries(tile.files)) {
            try {
                const [r, c] = this.currentTile.split('_');
                const name = 'tile_' + r + '_' + c + '_' + fileName;
                const blob = new Blob([content], { type: 'text/plain' });
                const file = new File([blob], name);
                const form = new FormData();
                form.append('chat_id', chatId);
                form.append('document', file);
                const resp = await fetch('https://api.telegram.org/bot' + token + '/sendDocument', {
                    method: 'POST',
                    body: form
                });
                const data = await resp.json();
                if (data.ok) {
                    this.syncedTiles.add(this.currentTile);
                    synced++;
                }
            } catch(e) {}
        }
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        showToast(`✅ تم مزامنة ${synced} ملف`, 'success');
    },

    syncAllFromChannel: async function() {
        const token = localStorage.getItem('cdn_bot_token');
        const chatId = localStorage.getItem('cdn_chat_id');
        if (!token || !chatId) {
            showToast('⚠️ قم بإعداد القناة', 'warning');
            return;
        }
        showToast('🔄 جاري...', 'info');
        try {
            const resp = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=100');
            const data = await resp.json();
            if (!data.ok) {
                showToast('❌ فشل', 'error');
                return;
            }
            let count = 0;
            for (const update of data.result) {
                const post = update.channel_post || update.message;
                if (!post || !post.document) continue;
                const fileName = post.document.file_name || '';
                const match = fileName.match(/^tile_(\d+)_(\d+)_(.+)$/);
                if (!match) continue;
                const r = parseInt(match[1]), c = parseInt(match[2]);
                const actual = match[3], id = r + '_' + c;
                const fr = await fetch('https://api.telegram.org/bot' + token + '/getFile?file_id=' + post.document.file_id);
                const fd = await fr.json();
                let content = null;
                if (fd.ok) {
                    try {
                        const cr = await fetch('https://api.telegram.org/file/bot' + token + '/' + fd.result.file_path);
                        content = await cr.text();
                    } catch(e) {}
                }
                if (!this.tiles[id]) {
                    this.tiles[id] = { id, row: r, col: c, files: {}, created: Date.now() };
                }
                if (content !== null) {
                    this.tiles[id].files[actual] = content;
                } else {
                    this.tiles[id].files[actual] = '[METADATA]\nfile_name: ' + fileName + '\nfile_id: ' + post.document.file_id;
                }
                this.syncedTiles.add(id);
                count++;
            }
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            showToast('✅ تم جلب ' + count + ' ملف', 'success');
        } catch(e) {
            showToast('❌ فشل', 'error');
        }
    },

    exportAllTiles() {
        const data = {
            tiles: this.tiles,
            protected: Array.from(this.protectedTiles),
            synced: Array.from(this.syncedTiles),
            repo: GitRepo.files,
            history: GitRepo.history
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cdn_backup_' + Date.now() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📤 تم التصدير', 'admin');
    },

    importAllTiles(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                this.tiles = data.tiles || this.tiles;
                this.protectedTiles = new Set(data.protected || []);
                this.syncedTiles = new Set(data.synced || []);
                if (data.repo) {
                    GitRepo.files = data.repo;
                    GitRepo.history = data.history || [];
                    GitRepo.save();
                }
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                showToast('📥 تم الاستيراد', 'admin');
            } catch(err) {
                showToast('❌ فشل', 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    },

    resetAll() {
        if (!confirm('⚠️ إعادة تعيين كل شيء؟')) return;
        localStorage.removeItem('cdn_tiles');
        localStorage.removeItem('cdn_protected');
        localStorage.removeItem('cdn_synced');
        localStorage.removeItem('gitlike_repo');
        localStorage.removeItem('gitlike_gist_token');
        localStorage.removeItem('gitlike_gist_id');
        this.tiles = {};
        this.protectedTiles = new Set();
        this.activeServers = new Set();
        this.syncedTiles = new Set();
        GitRepo.files = {};
        GitRepo.history = [];
        this.loadTiles();
        GitRepo.save();
        this.renderGrid();
        this.updateStats();
        this.closePanel();
        showToast('🔄 تم إعادة التعيين', 'warning');
    },

    closePanel() {
        document.getElementById('tilePanel').classList.remove('open');
    }
};
