<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖥️ إدارة الخوادم المصغرة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            padding: 15px;
            direction: rtl;
            overflow-y: auto;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* ====== الهيدر ====== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-controls { display: flex; gap: 6px; flex-wrap: wrap; }
        .header-controls button {
            padding: 4px 12px;
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 6px;
            background: rgba(139,92,246,0.1);
            color: #a78bfa;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .header-controls button:hover {
            background: rgba(139,92,246,0.25);
            transform: translateY(-1px);
        }
        .header-controls .btn-success {
            border-color: rgba(74,222,128,0.3);
            color: #4ade80;
        }
        .header-controls .btn-success:hover {
            background: rgba(74,222,128,0.2);
        }
        .header-controls .btn-danger {
            border-color: rgba(239,68,68,0.3);
            color: #f87171;
        }
        .header-controls .btn-danger:hover {
            background: rgba(239,68,68,0.2);
        }
        .header-controls .btn-warning {
            border-color: rgba(251,191,36,0.3);
            color: #fbbf24;
        }
        .header-controls .btn-warning:hover {
            background: rgba(251,191,36,0.2);
        }
        
        /* ====== زر الإغلاق ====== */
        .close-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: rgba(239,68,68,0.9);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
        }
        .close-btn:hover {
            background: rgba(239,68,68,1);
            transform: scale(1.05);
        }
        
        /* ====== الإحصائيات ====== */
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            padding: 8px;
            text-align: center;
        }
        .stat-box .num {
            font-size: 18px;
            font-weight: 800;
            display: block;
        }
        .stat-box .num.green { color: #4ade80; }
        .stat-box .num.purple { color: #a78bfa; }
        .stat-box .num.blue { color: #60a5fa; }
        .stat-box .num.yellow { color: #fbbf24; }
        .stat-box .num.red { color: #f87171; }
        .stat-box .label { font-size: 8px; color: #888; }
        
        /* ====== إعدادات التلجرام ====== */
        .telegram-settings {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(139,92,246,0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: none;
        }
        .telegram-settings.open { display: block; }
        .telegram-settings .row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .telegram-settings input {
            flex: 1;
            min-width: 120px;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 11px;
            font-family: inherit;
        }
        .telegram-settings input:focus {
            outline: none;
            border-color: rgba(139,92,246,0.4);
        }
        .telegram-settings .status {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 4px;
        }
        .telegram-settings .status.online { background: rgba(74,222,128,0.2); color: #4ade80; }
        .telegram-settings .status.offline { background: rgba(239,68,68,0.2); color: #f87171; }
        
        /* ====== شبكة المربعات ====== */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2px;
            margin-bottom: 12px;
        }
        .tile {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            padding: 1px;
            position: relative;
            min-height: 30px;
        }
        .tile:hover {
            background: rgba(139,92,246,0.15);
            border-color: rgba(139,92,246,0.4);
            transform: scale(1.05);
            z-index: 10;
        }
        .tile .icon { font-size: 14px; }
        .tile .label { color: #888; font-size: 5px; }
        .tile .status { font-size: 5px; margin-top: 1px; }
        .tile .status.online { color: #4ade80; }
        .tile .status.offline { color: #666; }
        .tile .status.running { color: #60a5fa; animation: pulse 1s infinite; }
        .tile.has-files {
            border-color: rgba(139,92,246,0.3);
            background: rgba(139,92,246,0.08);
        }
        .tile.protected {
            border-color: rgba(74,222,128,0.4);
            box-shadow: 0 0 10px rgba(74,222,128,0.1);
        }
        .tile .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #8b5cf6;
            color: #fff;
            font-size: 5px;
            padding: 1px 3px;
            border-radius: 4px;
            font-weight: 700;
        }
        .tile .sync-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: rgba(74,222,128,0.8);
            color: #fff;
            font-size: 5px;
            padding: 1px 3px;
            border-radius: 4px;
            font-weight: 700;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* ====== لوحة المربع ====== */
        .tile-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.97);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 12px;
            padding: 16px;
            width: 92%;
            max-width: 480px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 9999;
            backdrop-filter: blur(20px);
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .tile-panel.open { display: block; }
        
        .tile-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px;
        }
        .tile-panel .panel-header h3 { color: #a78bfa; font-size: 14px; }
        .tile-panel .panel-header button {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .tile-panel .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px 12px;
            margin-bottom: 8px;
        }
        .tile-panel .info-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 10px;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .tile-panel .info-item .value { color: #fff; }
        .tile-panel .info-item .value.online { color: #4ade80; }
        .tile-panel .info-item .value.offline { color: #f87171; }
        
        .tile-panel .file-list { margin: 8px 0; max-height: 150px; overflow-y: auto; }
        .tile-panel .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
            margin-bottom: 2px;
            font-size: 9px;
        }
        .tile-panel .file-item .name { color: #a78bfa; font-weight: 600; }
        .tile-panel .file-item .size { color: #666; font-size: 7px; }
        .tile-panel .file-item .actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 10px;
            padding: 0 2px;
        }
        .tile-panel .file-item .actions button:hover { color: #fff; }
        .tile-panel .file-item .actions .delete:hover { color: #f87171; }
        .tile-panel .file-item .actions .edit:hover { color: #fbbf24; }
        .tile-panel .file-item .actions .sync:hover { color: #4ade80; }
        
        .tile-panel .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .tile-panel .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .tile-panel .actions button:hover { transform: scale(1.03); }
        .tile-panel .actions .btn-upload { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .tile-panel .actions .btn-start { background: rgba(96,165,250,0.15); color: #60a5fa; border: 1px solid rgba(96,165,250,0.2); }
        .tile-panel .actions .btn-protect { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
        .tile-panel .actions .btn-delete { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
        .tile-panel .actions .btn-sync { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); grid-column: span 2; }
        
        /* ====== محرر الملف ====== */
        .file-editor {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.97);
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 12px;
            padding: 16px;
            width: 92%;
            max-width: 600px;
            max-height: 80vh;
            z-index: 99999;
            display: none;
            backdrop-filter: blur(20px);
        }
        .file-editor.open { display: block; }
        .file-editor .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .file-editor .editor-header h4 { color: #fbbf24; font-size: 12px; }
        .file-editor .editor-header button {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .file-editor textarea {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            resize: vertical;
            direction: ltr;
            text-align: left;
            tab-size: 4;
        }
        .file-editor .editor-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .file-editor .editor-actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
        }
        .file-editor .editor-actions .btn-save { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .file-editor .editor-actions .btn-close { background: rgba(255,255,255,0.06); color: #888; border: none; }
        
        /* ====== الإشعارات ====== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10,10,30,0.95);
            color: #fff;
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid rgba(139,92,246,0.2);
            z-index: 999999;
            font-size: 11px;
            display: none;
            animation: fadeIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.success { border-color: rgba(74,222,128,0.3); }
        .toast.error { border-color: rgba(239,68,68,0.3); }
        .toast.warning { border-color: rgba(251,191,36,0.3); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @media (max-width: 768px) {
            .grid { gap: 1px; }
            .tile { min-height: 25px; font-size: 6px; }
            .tile .icon { font-size: 10px; }
            .stats { grid-template-columns: repeat(3, 1fr); }
            .header h1 { font-size: 16px; }
            .header-controls button { font-size: 8px; padding: 3px 8px; }
            .tile-panel { padding: 12px; max-width: 95%; }
            .tile-panel .actions { grid-template-columns: 1fr; }
            .tile-panel .actions .btn-sync { grid-column: span 1; }
            .file-editor textarea { height: 150px; }
        }
        
        @media (max-width: 480px) {
            .grid { gap: 1px; }
            .tile { min-height: 20px; border-radius: 2px; }
            .tile .icon { font-size: 8px; }
            .tile .label { font-size: 4px; }
            .header { padding: 6px 10px; }
            .header h1 { font-size: 14px; }
        }
    </style>
</head>
<body>

<button class="close-btn" onclick="closeServerManager()">✖ إغلاق</button>

<div class="container">
    <div class="header">
        <h1>🖥️ إدارة الخوادم المصغرة</h1>
        <div class="header-controls">
            <button class="btn-warning" onclick="toggleTelegramSettings()">📡 القناة</button>
            <button class="btn-success" onclick="syncAllFromChannel()">🔄 مزامنة الكل</button>
            <button onclick="exportAllTiles()">📤 تصدير الكل</button>
            <button onclick="document.getElementById('importFile').click()">📥 استيراد</button>
            <button class="btn-danger" onclick="resetAll()">🔄 إعادة تعيين</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importAllTiles(event)">
        </div>
    </div>
    
    <div class="telegram-settings" id="telegramSettings">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="color:#a78bfa;font-size:12px;font-weight:600;">📡 إعدادات قناة التلجرام</span>
            <span class="status offline" id="tgStatus">🔴 غير متصل</span>
        </div>
        <div class="row">
            <input type="text" id="tgBotToken" placeholder="Bot Token" value="">
            <input type="text" id="tgChatId" placeholder="Chat ID" value="">
            <button onclick="saveTelegramSettings()" style="padding:4px 12px;background:rgba(74,222,128,0.15);color:#4ade80;border:1px solid rgba(74,222,128,0.2);border-radius:4px;cursor:pointer;font-family:inherit;font-size:10px;">💾 حفظ</button>
            <button onclick="testTelegramConnection()" style="padding:4px 12px;background:rgba(96,165,250,0.15);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);border-radius:4px;cursor:pointer;font-family:inherit;font-size:10px;">🧪 اختبار</button>
        </div>
    </div>
    
    <div class="stats" id="stats">
        <div class="stat-box"><span class="num purple" id="totalTiles">0</span><span class="label">📦 إجمالي</span></div>
        <div class="stat-box"><span class="num green" id="onlineTiles">0</span><span class="label">🟢 نشطة</span></div>
        <div class="stat-box"><span class="num blue" id="filesCount">0</span><span class="label">📄 ملفات</span></div>
        <div class="stat-box"><span class="num yellow" id="protectedCount">0</span><span class="label">🛡️ محمية</span></div>
        <div class="stat-box"><span class="num green" id="syncedCount">0</span><span class="label">🔄 مزامنة</span></div>
    </div>
    
    <div class="grid" id="grid"></div>
</div>

<div class="tile-panel" id="tilePanel">
    <div class="panel-header">
        <h3 id="panelTitle">📦 المربع (0,0)</h3>
        <button onclick="closePanel()">✖</button>
    </div>
    <div class="info-grid">
        <div class="info-item"><span>📍 الموقع</span><span class="value" id="panelLocation">(0, 0)</span></div>
        <div class="info-item"><span>🔄 الحالة</span><span class="value offline" id="panelStatus">⚪ غير نشط</span></div>
        <div class="info-item"><span>🛡️ الحماية</span><span class="value" id="panelProtected">❌ غير محمي</span></div>
        <div class="info-item"><span>📄 الملفات</span><span class="value" id="panelFileCount">0</span></div>
        <div class="info-item"><span>🔄 المزامنة</span><span class="value" id="panelSync">❌ غير متزامن</span></div>
    </div>
    <div class="file-list" id="panelFiles"></div>
    <div class="actions">
        <button class="btn-upload" onclick="uploadFile()">📤 رفع ملف</button>
        <button class="btn-start" onclick="toggleServer()" id="panelStartBtn">▶️ تشغيل</button>
        <button class="btn-protect" onclick="toggleProtect()" id="panelProtectBtn">🛡️ حماية</button>
        <button class="btn-delete" onclick="clearTile()">🗑️ تفريغ</button>
        <button class="btn-sync" onclick="syncTileToChannel()">🔄 مزامنة</button>
    </div>
</div>

<div class="file-editor" id="fileEditor">
    <div class="editor-header">
        <h4 id="editorTitle">📝 تحرير الملف</h4>
        <button onclick="closeEditor()">✖</button>
    </div>
    <textarea id="editorContent" spellcheck="false"></textarea>
    <div class="editor-actions">
        <button class="btn-save" onclick="saveFile()">💾 حفظ</button>
        <button class="btn-close" onclick="closeEditor()">✖ إلغاء</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 📦 نظام إدارة الخوادم المصغرة
// ============================================================

function closeServerManager() {
    if (window.parent && window.parent.closeServerManager) {
        window.parent.closeServerManager();
    } else {
        window.close();
    }
}

// ============================================================
// 🖥️ ServerManager - النظام الرئيسي
// ============================================================

const ServerManager = {
    currentTile: null,
    currentFile: null,
    tiles: {},
    protectedTiles: new Set(),
    activeServers: new Set(),
    syncedTiles: new Set(),
    
    init: function() {
        console.log('🖥️ تشغيل نظام إدارة الخوادم...');
        this.loadTiles();
        this.loadTelegramSettings();
        this.renderGrid();
        this.updateStats();
        console.log('✅ النظام جاهز');
    },
    
    loadTiles: function() {
        const saved = localStorage.getItem('server_tiles');
        if (saved) {
            try {
                this.tiles = JSON.parse(saved);
                const protectedData = localStorage.getItem('server_protected');
                if (protectedData) this.protectedTiles = new Set(JSON.parse(protectedData));
                const syncedData = localStorage.getItem('server_synced');
                if (syncedData) this.syncedTiles = new Set(JSON.parse(syncedData));
                return;
            } catch(e) {}
        }
        
        for (let row = 0; row < 12; row++) {
            for (let col = 0; col < 12; col++) {
                const id = `${row}_${col}`;
                this.tiles[id] = {
                    id: id, row: row, col: col,
                    files: this.getDefaultFiles(row, col),
                    created: Date.now()
                };
            }
        }
        this.saveTiles();
    },
    
    getDefaultFiles: function(row, col) {
        const types = ['تسجيل', 'تحليل', 'إشعارات', 'نسخ', 'ويب هوك', 'مجدول', 'ذاكرة', 'بوابة'];
        const type = types[(row * 12 + col) % types.length];
        return {
            'main.js': `// خادم (${row}, ${col}) - نوع: ${type}\nclass TileServer {\n    constructor() {\n        this.name = 'خادم (${row},${col})';\n        this.type = '${type}';\n        this.data = [];\n        this.requests = 0;\n    }\n    start() {\n        console.log('🟢 بدء خادم (${row},${col})');\n        setInterval(() => {\n            this.requests++;\n            this.log('🔄 خادم يعمل');\n        }, 30000);\n        return this;\n    }\n    log(msg) {\n        console.log(\`[\${this.name}] \${msg}\`);\n    }\n}\nconst server = new TileServer();\nserver.start();\nwindow.servers = window.servers || {};\nwindow.servers['${row}_${col}'] = server;`,
            'style.css': `/* مربع (${row}, ${col}) */\n.tile-${row}-${col} {\n    background: linear-gradient(135deg, #1a1a2e, #16213e);\n    width: 100%;\n    height: 100%;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    border-radius: 4px;\n}\n.tile-${row}-${col} .icon { font-size: 20px; }\n.tile-${row}-${col} .name { color: #ffd700; font-size: 8px; font-weight: 700; }\n.tile-${row}-${col} .type { color: #888; font-size: 6px; }`,
            'index.html': `<div class="tile-${row}-${col}"><div class="icon">${this.getIcon(type)}</div><div class="name">(${row},${col})</div><div class="type">${type}</div></div>`
        };
    },
    
    getIcon: function(type) {
        const icons = { 'تسجيل': '📋', 'تحليل': '📊', 'إشعارات': '🔔', 'نسخ': '💾', 'ويب هوك': '🔗', 'مجدول': '⏰', 'ذاكرة': '💨', 'بوابة': '🌐' };
        return icons[type] || '🖥️';
    },
    
    saveTiles: function() {
        localStorage.setItem('server_tiles', JSON.stringify(this.tiles));
        localStorage.setItem('server_protected', JSON.stringify(Array.from(this.protectedTiles)));
        localStorage.setItem('server_synced', JSON.stringify(Array.from(this.syncedTiles)));
    },
    
    renderGrid: function() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let row = 0; row < 12; row++) {
            for (let col = 0; col < 12; col++) {
                const id = `${row}_${col}`;
                const tile = this.tiles[id];
                const isProtected = this.protectedTiles.has(id);
                const isActive = this.activeServers.has(id);
                const isSynced = this.syncedTiles.has(id);
                const fileCount = tile.files ? Object.keys(tile.files).length : 0;
                const div = document.createElement('div');
                div.className = 'tile';
                if (fileCount > 0) div.classList.add('has-files');
                if (isProtected) div.classList.add('protected');
                div.dataset.tile = id;
                let html = `<div class="icon">${this.getTileIcon(tile)}</div>`;
                html += `<div class="label">${row},${col}</div>`;
                html += `<div class="status ${isActive ? 'running' : 'offline'}">${isActive ? '🟢 نشط' : '⚪ متوقف'}</div>`;
                if (fileCount > 0) html += `<div class="badge">${fileCount}</div>`;
                if (isSynced) html += `<div class="sync-badge">🔄</div>`;
                div.innerHTML = html;
                div.onclick = () => this.openPanel(id);
                grid.appendChild(div);
            }
        }
    },
    
    getTileIcon: function(tile) {
        if (!tile || !tile.files) return '📦';
        const html = tile.files['index.html'] || '';
        const match = html.match(/<div class="icon">(.*?)<\/div>/);
        return match ? match[1] : '📦';
    },
    
    updateStats: function() {
        const total = Object.keys(this.tiles).length;
        const online = this.activeServers.size;
        let files = 0;
        Object.values(this.tiles).forEach(t => { if (t.files) files += Object.keys(t.files).length; });
        document.getElementById('totalTiles').textContent = total;
        document.getElementById('onlineTiles').textContent = online;
        document.getElementById('filesCount').textContent = files;
        document.getElementById('protectedCount').textContent = this.protectedTiles.size;
        document.getElementById('syncedCount').textContent = this.syncedTiles.size;
    },
    
    openPanel: function(id) {
        this.currentTile = id;
        const tile = this.tiles[id];
        if (!tile) return;
        const panel = document.getElementById('tilePanel');
        panel.classList.add('open');
        document.getElementById('panelTitle').textContent = `📦 المربع (${tile.row}, ${tile.col})`;
        document.getElementById('panelLocation').textContent = `(${tile.row}, ${tile.col})`;
        const isActive = this.activeServers.has(id);
        const statusEl = document.getElementById('panelStatus');
        statusEl.textContent = isActive ? '🟢 نشط' : '⚪ غير نشط';
        statusEl.className = `value ${isActive ? 'online' : 'offline'}`;
        const isProtected = this.protectedTiles.has(id);
        document.getElementById('panelProtected').textContent = isProtected ? '✅ محمي' : '❌ غير محمي';
        document.getElementById('panelProtected').style.color = isProtected ? '#4ade80' : '#f87171';
        const isSynced = this.syncedTiles.has(id);
        document.getElementById('panelSync').textContent = isSynced ? '✅ متزامن' : '❌ غير متزامن';
        document.getElementById('panelSync').style.color = isSynced ? '#4ade80' : '#f87171';
        document.getElementById('panelStartBtn').textContent = isActive ? '⏹️ إيقاف' : '▶️ تشغيل';
        document.getElementById('panelProtectBtn').textContent = isProtected ? '🔓 إزالة' : '🛡️ حماية';
        this.renderFiles(tile);
        document.getElementById('panelFileCount').textContent = tile.files ? Object.keys(tile.files).length : 0;
    },
    
    renderFiles: function(tile) {
        const container = document.getElementById('panelFiles');
        container.innerHTML = '';
        if (!tile.files || Object.keys(tile.files).length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:10px;">📭 لا توجد ملفات</div>';
            return;
        }
        Object.entries(tile.files).forEach(([name, content]) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            const size = new Blob([content]).size;
            const sizeStr = size < 1024 ? size + ' B' : (size / 1024).toFixed(1) + ' KB';
            div.innerHTML = `
                <span class="name">${name}</span>
                <span class="size">${sizeStr}</span>
                <span class="actions">
                    <button class="edit" onclick="ServerManager.editFile('${tile.id}', '${name}')" title="تحرير">✏️</button>
                    <button class="sync" onclick="ServerManager.syncFileToChannel('${tile.id}', '${name}')" title="مزامنة">🔄</button>
                    <button onclick="ServerManager.downloadFile('${tile.id}', '${name}')" title="تحميل">⬇️</button>
                    <button class="delete" onclick="ServerManager.deleteFile('${tile.id}', '${name}')" title="حذف">🗑️</button>
                </span>
            `;
            container.appendChild(div);
        });
    },
    
    closePanel: function() {
        document.getElementById('tilePanel').classList.remove('open');
        this.currentTile = null;
    },
    
    uploadFile: function() {
        if (!this.currentTile) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.onchange = (e) => {
            const files = e.target.files;
            let count = 0;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const tile = this.tiles[this.currentTile];
                    if (!tile.files) tile.files = {};
                    tile.files[file.name] = ev.target.result;
                    this.saveTiles();
                    this.renderGrid();
                    this.updateStats();
                    this.renderFiles(tile);
                    count++;
                    if (count === files.length) {
                        this.showToast(`✅ تم رفع ${count} ملف`, 'success');
                    }
                };
                reader.readAsText(file);
            }
        };
        input.click();
    },
    
    editFile: function(tileId, fileName) {
        this.currentTile = tileId;
        this.currentFile = fileName;
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        const editor = document.getElementById('fileEditor');
        editor.classList.add('open');
        document.getElementById('editorTitle').textContent = `📝 تحرير ${fileName}`;
        document.getElementById('editorContent').value = tile.files[fileName];
    },
    
    saveFile: function() {
        if (!this.currentTile || !this.currentFile) return;
        const content = document.getElementById('editorContent').value;
        this.tiles[this.currentTile].files[this.currentFile] = content;
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.closeEditor();
        this.showToast(`✅ تم حفظ ${this.currentFile}`, 'success');
    },
    
    closeEditor: function() {
        document.getElementById('fileEditor').classList.remove('open');
        this.currentFile = null;
    },
    
    downloadFile: function(tileId, fileName) {
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        const blob = new Blob([tile.files[fileName]], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    },
    
    deleteFile: function(tileId, fileName) {
        if (!confirm(`🗑️ حذف ${fileName}؟`)) return;
        const tile = this.tiles[tileId];
        if (tile && tile.files) {
            delete tile.files[fileName];
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.renderFiles(tile);
            this.showToast(`🗑️ تم حذف ${fileName}`, 'warning');
        }
    },
    
    toggleServer: function() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.activeServers.has(id)) {
            this.activeServers.delete(id);
            this.showToast('⏹️ تم إيقاف الخادم', 'warning');
        } else {
            this.activeServers.add(id);
            const tile = this.tiles[id];
            if (tile && tile.files && tile.files['main.js']) {
                try {
                    console.log(`🟢 تشغيل خادم (${tile.row},${tile.col})`);
                    this.showToast(`🟢 تم تشغيل خادم (${tile.row},${tile.col})`, 'success');
                } catch(e) {
                    this.showToast('❌ خطأ في تشغيل الخادم', 'error');
                    this.activeServers.delete(id);
                }
            } else {
                this.showToast('⚠️ لا يوجد ملف main.js', 'warning');
                this.activeServers.delete(id);
            }
        }
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },
    
    toggleProtect: function() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.protectedTiles.has(id)) {
            this.protectedTiles.delete(id);
            this.showToast('🔓 تم إزالة الحماية', 'warning');
        } else {
            this.protectedTiles.add(id);
            this.showToast('🛡️ تم تفعيل الحماية', 'success');
        }
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },
    
    clearTile: function() {
        if (!this.currentTile) return;
        if (!confirm(`🗑️ تفريغ المربع (${this.currentTile})؟`)) return;
        const tile = this.tiles[this.currentTile];
        if (tile) {
            tile.files = {};
            this.activeServers.delete(this.currentTile);
            this.protectedTiles.delete(this.currentTile);
            this.syncedTiles.delete(this.currentTile);
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.openPanel(this.currentTile);
            this.showToast('🗑️ تم تفريغ المربع', 'warning');
        }
    },
    
    // ====== نظام التلجرام ======
    loadTelegramSettings: function() {
        const token = localStorage.getItem('telegram_bot_token') || '';
        const chatId = localStorage.getItem('telegram_chat_id') || '';
        document.getElementById('tgBotToken').value = token;
        document.getElementById('tgChatId').value = chatId;
        this.updateTelegramStatus();
    },
    
    saveTelegramSettings: function() {
        const token = document.getElementById('tgBotToken').value.trim();
        const chatId = document.getElementById('tgChatId').value.trim();
        if (!token || !chatId) {
            this.showToast('⚠️ أدخل Token و Chat ID', 'warning');
            return;
        }
        localStorage.setItem('telegram_bot_token', token);
        localStorage.setItem('telegram_chat_id', chatId);
        this.updateTelegramStatus();
        this.showToast('✅ تم حفظ إعدادات التلجرام', 'success');
    },
    
    testTelegramConnection: async function() {
        const token = document.getElementById('tgBotToken').value.trim();
        if (!token) {
            this.showToast('⚠️ أدخل Bot Token أولاً', 'warning');
            return;
        }
        try {
            const resp = await fetch(`https://api.telegram.org/bot${token}/getMe`);
            const data = await resp.json();
            if (data.ok) {
                this.showToast(`✅ البوت متصل: @${data.result.username}`, 'success');
                document.getElementById('tgStatus').className = 'status online';
                document.getElementById('tgStatus').textContent = '🟢 متصل';
            } else {
                this.showToast('❌ فشل الاتصال: ' + data.description, 'error');
            }
        } catch(e) {
            this.showToast('❌ خطأ في الاتصال', 'error');
        }
    },
    
    updateTelegramStatus: function() {
        const token = localStorage.getItem('telegram_bot_token') || '';
        const chatId = localStorage.getItem('telegram_chat_id') || '';
        const el = document.getElementById('tgStatus');
        if (token && chatId) {
            el.className = 'status online';
            el.textContent = '🟢 متصل';
        } else {
            el.className = 'status offline';
            el.textContent = '🔴 غير متصل';
        }
    },
    
    toggleTelegramSettings: function() {
        const el = document.getElementById('telegramSettings');
        el.classList.toggle('open');
        if (el.classList.contains('open')) this.loadTelegramSettings();
    },
    
    syncFileToChannel: async function(tileId, fileName) {
        const token = localStorage.getItem('telegram_bot_token');
        const chatId = localStorage.getItem('telegram_chat_id');
        if (!token || !chatId) {
            this.showToast('⚠️ قم بإعداد التلجرام أولاً', 'warning');
            return;
        }
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) {
            this.showToast('❌ الملف غير موجود', 'error');
            return;
        }
        try {
            const [row, col] = tileId.split('_');
            const formattedName = `tile_${row}_${col}_${fileName}`;
            const content = tile.files[fileName];
            const blob = new Blob([content], { type: 'text/plain' });
            const file = new File([blob], formattedName);
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', file);
            const resp = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            if (data.ok) {
                this.syncedTiles.add(tileId);
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                this.openPanel(tileId);
                this.showToast(`✅ تم مزامنة ${formattedName}`, 'success');
            } else {
                this.showToast('❌ فشل المزامنة: ' + data.description, 'error');
            }
        } catch(e) {
            this.showToast('❌ خطأ في المزامنة', 'error');
        }
    },
    
    syncAllFromChannel: async function() {
        const token = localStorage.getItem('telegram_bot_token');
        const chatId = localStorage.getItem('telegram_chat_id');
        if (!token || !chatId) {
            this.showToast('⚠️ قم بإعداد التلجرام أولاً', 'warning');
            return;
        }
        this.showToast('🔄 جاري المزامنة...', 'warning');
        try {
            const resp = await fetch(`https://api.telegram.org/bot${token}/getUpdates?limit=100`);
            const data = await resp.json();
            if (!data.ok) {
                this.showToast('❌ فشل جلب التحديثات', 'error');
                return;
            }
            let synced = 0;
            for (const update of data.result) {
                const msg = update.channel_post || update.message;
                if (!msg || !msg.document) continue;
                const fileName = msg.document.file_name || '';
                const match = fileName.match(/tile_(\d+)_(\d+)_(.+)/);
                if (!match) continue;
                const row = parseInt(match[1]);
                const col = parseInt(match[2]);
                const tileId = `${row}_${col}`;
                const fileType = match[3];
                const fileResp = await fetch(`https://api.telegram.org/bot${token}/getFile?file_id=${msg.document.file_id}`);
                const fileData = await fileResp.json();
                if (!fileData.ok) continue;
                const fileUrl = `https://api.telegram.org/file/bot${token}/${fileData.result.file_path}`;
                const contentResp = await fetch(fileUrl);
                const content = await contentResp.text();
                if (!this.tiles[tileId]) {
                    this.tiles[tileId] = { id: tileId, row: row, col: col, files: {}, created: Date.now() };
                }
                this.tiles[tileId].files[fileType] = content;
                this.syncedTiles.add(tileId);
                synced++;
            }
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.showToast(`✅ تم مزامنة ${synced} ملف`, 'success');
        } catch(e) {
            this.showToast('❌ فشل المزامنة: ' + e.message, 'error');
        }
    },
    
    syncTileToChannel: async function() {
        if (!this.currentTile) return;
        const tile = this.tiles[this.currentTile];
        if (!tile || !tile.files) {
            this.showToast('❌ لا توجد ملفات للمزامنة', 'error');
            return;
        }
        let synced = 0;
        for (const fileName of Object.keys(tile.files)) {
            await this.syncFileToChannel(this.currentTile, fileName);
            synced++;
        }
        if (synced > 0) this.showToast(`✅ تم مزامنة ${synced} ملف`, 'success');
    },
    
    exportAllTiles: function() {
        const data = {
            tiles: this.tiles,
            protected: Array.from(this.protectedTiles),
            synced: Array.from(this.syncedTiles),
            exported: Date.now(),
            version: '2.0'
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `servers_backup_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('📤 تم تصدير جميع المربعات', 'success');
    },
    
    importAllTiles: function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                this.tiles = data.tiles || this.tiles;
                this.protectedTiles = new Set(data.protected || []);
                this.syncedTiles = new Set(data.synced || []);
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                this.showToast('📥 تم استيراد المربعات', 'success');
            } catch(err) {
                this.showToast('❌ فشل الاستيراد: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    },
    
    resetAll: function() {
        if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين كل شيء؟')) return;
        localStorage.removeItem('server_tiles');
        localStorage.removeItem('server_protected');
        localStorage.removeItem('server_synced');
        this.tiles = {};
        this.protectedTiles = new Set();
        this.activeServers = new Set();
        this.syncedTiles = new Set();
        this.loadTiles();
        this.renderGrid();
        this.updateStats();
        this.closePanel();
        this.showToast('🔄 تم إعادة التعيين', 'warning');
    },
    
    showToast: function(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + (type || 'info');
        toast.style.display = 'block';
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
            toast.style.display = 'none';
        }, 4000);
    }
};

// ====== دوال الواجهة العامة ======
function closePanel() { ServerManager.closePanel(); }
function closeEditor() { ServerManager.closeEditor(); }
function uploadFile() { ServerManager.uploadFile(); }
function toggleServer() { ServerManager.toggleServer(); }
function toggleProtect() { ServerManager.toggleProtect(); }
function clearTile() { ServerManager.clearTile(); }
function syncTileToChannel() { ServerManager.syncTileToChannel(); }
function syncAllFromChannel() { ServerManager.syncAllFromChannel(); }
function exportAllTiles() { ServerManager.exportAllTiles(); }
function importAllTiles(e) { ServerManager.importAllTiles(e); }
function resetAll() { ServerManager.resetAll(); }
function toggleTelegramSettings() { ServerManager.toggleTelegramSettings(); }
function saveTelegramSettings() { ServerManager.saveTelegramSettings(); }
function testTelegramConnection() { ServerManager.testTelegramConnection(); }

// ====== بدء النظام ======
document.addEventListener('DOMContentLoaded', function() {
    ServerManager.init();
    console.log('🖥️ نظام إدارة الخوادم جاهز!');
    console.log('📡 استخدم القناة لمزامنة الملفات');
    console.log('💡 انقر على أي مربع لفتحه وإضافة ملفات');
});

window.ServerManager = ServerManager;
</script>
