<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 شريط متحرك</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a2a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;direction:rtl}
.box{background:rgba(10,10,30,0.95);border:2px solid #8b5cf6;border-radius:16px;padding:30px;text-align:center;width:400px}
h2{color:#a78bfa;margin-bottom:15px}
.bar-container{width:100%;height:30px;background:#1a1a3a;border-radius:15px;overflow:hidden;border:1px solid #333}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#ffd700);border-radius:15px;transition:width 0.1s}
.status{color:#888;font-size:13px;margin-top:10px}
.btn{padding:10px 25px;border:none;border-radius:10px;background:#8b5cf6;color:#fff;font-weight:700;cursor:pointer;font-size:14px;margin:5px;transition:0.3s}
.btn:hover{transform:scale(1.05)}
.btn-green{background:#4ade80;color:#111}
.btn-red{background:#ef4444}
.btn-gold{background:#ffd700;color:#111}
</style>
</head>
<body>
<div class="box">
    <h2>📊 شريط متحرك</h2>
    <div class="bar-container"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">⏸️ متوقف</div>
    <div style="margin-top:15px">
        <button class="btn btn-green" onclick="startBar()">▶️ تشغيل</button>
        <button class="btn btn-red" onclick="stopBar()">⏹️ إيقاف</button>
        <button class="btn btn-gold" onclick="resetBar()">🔄 إعادة</button>
    </div>
    <div style="margin-top:10px;color:#666;font-size:11px">📍 المربع (6,6) | <span id="percent">0%</span></div>
</div>
<script src="main.js"></script>
</body>
</html>
