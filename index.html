<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 الخوادم المصغرة - نظام المربعات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* ====== الهيكل الرئيسي ====== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .header-controls button {
            padding: 8px 16px;
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 8px;
            background: rgba(139,92,246,0.1);
            color: #a78bfa;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .header-controls button:hover {
            background: rgba(139,92,246,0.25);
            transform: translateY(-1px);
        }
        
        .header-controls .btn-danger {
            border-color: rgba(239,68,68,0.3);
            color: #f87171;
        }
        
        .header-controls .btn-danger:hover {
            background: rgba(239,68,68,0.2);
        }
        
        /* ====== الإحصائيات ====== */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .stat-box .num {
            font-size: 22px;
            font-weight: 800;
            display: block;
        }
        
        .stat-box .num.green { color: #4ade80; }
        .stat-box .num.purple { color: #a78bfa; }
        .stat-box .num.blue { color: #60a5fa; }
        .stat-box .num.yellow { color: #fbbf24; }
        .stat-box .num.red { color: #f87171; }
        
        .stat-box .label {
            font-size: 10px;
            color: #888;
        }
        
        /* ====== شبكة المربعات ====== */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            margin-bottom: 20px;
        }
        
        .tile {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            padding: 2px;
            position: relative;
            min-height: 50px;
        }
        
        .tile:hover {
            background: rgba(139,92,246,0.1);
            border-color: rgba(139,92,246,0.3);
            transform: scale(1.05);
            z-index: 10;
        }
        
        .tile .icon { font-size: 16px; }
        .tile .label { color: #888; font-size: 7px; }
        .tile .status { font-size: 6px; margin-top: 2px; }
        .tile .status.online { color: #4ade80; }
        .tile .status.offline { color: #f87171; }
        
        .tile.has-files {
            border-color: rgba(139,92,246,0.3);
            background: rgba(139,92,246,0.05);
        }
        
        .tile.protected {
            border-color: rgba(74,222,128,0.4);
            box-shadow: 0 0 15px rgba(74,222,128,0.1);
        }
        
        .tile .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #8b5cf6;
            color: #fff;
            font-size: 7px;
            padding: 1px 5px;
            border-radius: 8px;
            font-weight: 700;
        }
        
        /* ====== لوحة المربع ====== */
        .tile-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.97);
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 9999;
            backdrop-filter: blur(20px);
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        
        .tile-panel.open { display: block; }
        
        .tile-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 12px;
        }
        
        .tile-panel .panel-header h3 {
            color: #a78bfa;
            font-size: 16px;
        }
        
        .tile-panel .panel-header button {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .tile-panel .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        
        .tile-panel .info-row .value { color: #fff; }
        
        .tile-panel .file-list {
            margin: 12px 0;
        }
        
        .tile-panel .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 11px;
        }
        
        .tile-panel .file-item .name {
            color: #a78bfa;
            font-weight: 600;
        }
        
        .tile-panel .file-item .size {
            color: #666;
            font-size: 9px;
        }
        
        .tile-panel .file-item .actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            padding: 0 4px;
        }
        
        .tile-panel .file-item .actions button:hover { color: #fff; }
        .tile-panel .file-item .actions .delete:hover { color: #f87171; }
        
        .tile-panel .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        
        .tile-panel .actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            flex: 1;
            min-width: 70px;
        }
        
        .tile-panel .actions .btn-upload {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.2);
        }
        
        .tile-panel .actions .btn-start {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
            border: 1px solid rgba(96,165,250,0.2);
        }
        
        .tile-panel .actions .btn-protect {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.2);
        }
        
        .tile-panel .actions .btn-delete {
            background: rgba(239,68,68,0.15);
            color: #f87171;
            border: 1px solid rgba(239,68,68,0.2);
        }
        
        .tile-panel .actions button:hover {
            transform: scale(1.05);
        }
        
        /* ====== محرر الملف ====== */
        .file-editor {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.97);
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            z-index: 99999;
            display: none;
            backdrop-filter: blur(20px);
        }
        
        .file-editor.open { display: block; }
        
        .file-editor .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .file-editor .editor-header h4 {
            color: #fbbf24;
            font-size: 14px;
        }
        
        .file-editor textarea {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
            direction: ltr;
            text-align: left;
            tab-size: 4;
        }
        
        .file-editor .editor-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .file-editor .editor-actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            flex: 1;
        }
        
        .file-editor .editor-actions .btn-save {
            background: rgba(74,222,128,0.15);
            color: #4ade80;
            border: 1px solid rgba(74,222,128,0.2);
        }
        
        .file-editor .editor-actions .btn-close {
            background: rgba(255,255,255,0.06);
            color: #888;
            border: none;
        }
        
        /* ====== الإشعارات ====== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10,10,30,0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(139,92,246,0.2);
            z-index: 999999;
            font-size: 13px;
            display: none;
            animation: fadeIn 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* ====== استجابة ====== */
        @media (max-width: 768px) {
            .grid { gap: 2px; }
            .tile { min-height: 35px; font-size: 7px; }
            .tile .icon { font-size: 12px; }
            .tile .label { font-size: 6px; }
            .header h1 { font-size: 18px; }
            .header-controls button { font-size: 10px; padding: 6px 12px; }
            .stats { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 480px) {
            .grid { gap: 1px; }
            .tile { min-height: 28px; border-radius: 3px; }
            .tile .icon { font-size: 10px; }
            .tile-panel { padding: 16px; }
            .tile-panel .actions button { font-size: 10px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ====== الهيدر ====== -->
    <div class="header">
        <h1>📦 الخوادم المصغرة</h1>
        <div class="header-controls">
            <button onclick="System.exportAll()">📤 تصدير الكل</button>
            <button onclick="document.getElementById('importFile').click()">📥 استيراد</button>
            <button class="btn-danger" onclick="System.resetAll()">🔄 إعادة تعيين</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="System.importAll(event)">
        </div>
    </div>
    
    <!-- ====== الإحصائيات ====== -->
    <div class="stats" id="stats">
        <div class="stat-box"><span class="num purple" id="totalTiles">0</span><span class="label">📦 إجمالي</span></div>
        <div class="stat-box"><span class="num green" id="onlineTiles">0</span><span class="label">🟢 نشطة</span></div>
        <div class="stat-box"><span class="num blue" id="filesCount">0</span><span class="label">📄 ملفات</span></div>
        <div class="stat-box"><span class="num yellow" id="protectedCount">0</span><span class="label">🛡️ محمية</span></div>
    </div>
    
    <!-- ====== شبكة المربعات ====== -->
    <div class="grid" id="grid"></div>
</div>

<!-- ====== لوحة المربع ====== -->
<div class="tile-panel" id="tilePanel">
    <div class="panel-header">
        <h3 id="panelTitle">📦 المربع (0,0)</h3>
        <button onclick="System.closePanel()">✖</button>
    </div>
    <div class="info-row"><span>📍 الموقع</span><span class="value" id="panelLocation">(0, 0)</span></div>
    <div class="info-row"><span>🔄 الحالة</span><span class="value" id="panelStatus">⚪ غير نشط</span></div>
    <div class="info-row"><span>🛡️ الحماية</span><span class="value" id="panelProtected">❌ غير محمي</span></div>
    <div class="info-row"><span>📄 الملفات</span><span class="value" id="panelFileCount">0</span></div>
    
    <div class="file-list" id="panelFiles"></div>
    
    <div class="actions">
        <button class="btn-upload" onclick="System.uploadFile()">📤 رفع ملف</button>
        <button class="btn-start" onclick="System.toggleServer()" id="panelStartBtn">▶️ تشغيل</button>
        <button class="btn-protect" onclick="System.toggleProtect()" id="panelProtectBtn">🛡️ حماية</button>
        <button class="btn-delete" onclick="System.clearTile()">🗑️ تفريغ</button>
    </div>
</div>

<!-- ====== محرر الملف ====== -->
<div class="file-editor" id="fileEditor">
    <div class="editor-header">
        <h4 id="editorTitle">📝 تحرير الملف</h4>
        <button onclick="System.closeEditor()" style="background:rgba(239,68,68,0.15);color:#f87171;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;">✖</button>
    </div>
    <textarea id="editorContent" spellcheck="false"></textarea>
    <div class="editor-actions">
        <button class="btn-save" onclick="System.saveFile()">💾 حفظ</button>
        <button class="btn-close" onclick="System.closeEditor()">✖ إلغاء</button>
    </div>
</div>

<!-- ====== الإشعارات ====== -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 📦 النظام الرئيسي
// ============================================================

const System = {
    // ====== الحالة ======
    currentTile: null,
    currentFile: null,
    tiles: {},
    protectedTiles: new Set(),
    activeServers: new Set(),
    
    // ====== التهيئة ======
    init: function() {
        console.log('📦 تشغيل نظام الخوادم المصغرة...');
        this.loadTiles();
        this.renderGrid();
        this.updateStats();
        console.log('✅ النظام جاهز');
    },
    
    // ====== تحميل المربعات ======
    loadTiles: function() {
        // محاولة تحميل من localStorage
        const saved = localStorage.getItem('mini_servers_tiles');
        if (saved) {
            try {
                this.tiles = JSON.parse(saved);
                // استعادة الحماية
                const protectedData = localStorage.getItem('mini_servers_protected');
                if (protectedData) {
                    this.protectedTiles = new Set(JSON.parse(protectedData));
                }
                return;
            } catch(e) {}
        }
        
        // إنشاء مربعات افتراضية
        for (let row = 0; row < 12; row++) {
            for (let col = 0; col < 12; col++) {
                const id = `${row}_${col}`;
                this.tiles[id] = {
                    id: id,
                    row: row,
                    col: col,
                    files: this.getDefaultFiles(row, col),
                    created: Date.now()
                };
            }
        }
        this.saveTiles();
    },
    
    // ====== الملفات الافتراضية ======
    getDefaultFiles: function(row, col) {
        const types = ['تسجيل', 'تحليل', 'إشعارات', 'نسخ احتياطي', 'ويب هوك', 'مجدول', 'ذاكرة مؤقتة', 'بوابة'];
        const type = types[(row * 12 + col) % types.length];
        
        return {
            'main.js': `// خادم (${row}, ${col}) - نوع: ${type}
class TileServer {
    constructor() {
        this.name = 'خادم (${row},${col})';
        this.type = '${type}';
        this.data = [];
        this.requests = 0;
    }
    
    start() {
        console.log('🟢 بدء خادم (${row},${col})');
        // مهمة الخادم
        setInterval(() => {
            this.requests++;
            this.log('🔄 خادم يعمل');
        }, 30000);
        return this;
    }
    
    log(msg) {
        console.log(\`[\${this.name}] \${msg}\`);
    }
}

const server = new TileServer();
server.start();
window.servers = window.servers || {};
window.servers['${row}_${col}'] = server;`,
            
            'style.css': `/* مربع (${row}, ${col}) */
.tile-${row}-${col} {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
}
.tile-${row}-${col} .icon { font-size: 24px; }
.tile-${row}-${col} .name { color: #ffd700; font-size: 9px; font-weight: 700; }
.tile-${row}-${col} .type { color: #888; font-size: 7px; }`,
            
            'index.html': `<div class="tile-${row}-${col}">
    <div class="icon">${this.getIcon(type)}</div>
    <div class="name">(${row},${col})</div>
    <div class="type">${type}</div>
</div>`
        };
    },
    
    getIcon: function(type) {
        const icons = {
            'تسجيل': '📋',
            'تحليل': '📊',
            'إشعارات': '🔔',
            'نسخ احتياطي': '💾',
            'ويب هوك': '🔗',
            'مجدول': '⏰',
            'ذاكرة مؤقتة': '💨',
            'بوابة': '🌐'
        };
        return icons[type] || '🖥️';
    },
    
    // ====== حفظ ======
    saveTiles: function() {
        localStorage.setItem('mini_servers_tiles', JSON.stringify(this.tiles));
        localStorage.setItem('mini_servers_protected', JSON.stringify(Array.from(this.protectedTiles)));
    },
    
    // ====== عرض الشبكة ======
    renderGrid: function() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        for (let row = 0; row < 12; row++) {
            for (let col = 0; col < 12; col++) {
                const id = `${row}_${col}`;
                const tile = this.tiles[id];
                const isProtected = this.protectedTiles.has(id);
                const isActive = this.activeServers.has(id);
                const fileCount = tile.files ? Object.keys(tile.files).length : 0;
                
                const div = document.createElement('div');
                div.className = 'tile';
                if (fileCount > 0) div.classList.add('has-files');
                if (isProtected) div.classList.add('protected');
                div.dataset.tile = id;
                
                // محتوى المربع
                let html = `<div class="icon">${this.getTileIcon(tile)}</div>`;
                html += `<div class="label">${row},${col}</div>`;
                html += `<div class="status ${isActive ? 'online' : 'offline'}">${isActive ? '🟢 نشط' : '⚪ متوقف'}</div>`;
                if (fileCount > 0) {
                    html += `<div class="badge">${fileCount}</div>`;
                }
                div.innerHTML = html;
                
                div.onclick = () => this.openPanel(id);
                grid.appendChild(div);
            }
        }
    },
    
    getTileIcon: function(tile) {
        if (!tile || !tile.files) return '📦';
        const html = tile.files['index.html'] || '';
        const match = html.match(/<div class="icon">(.*?)<\/div>/);
        return match ? match[1] : '📦';
    },
    
    // ====== الإحصائيات ======
    updateStats: function() {
        const total = Object.keys(this.tiles).length;
        const online = this.activeServers.size;
        let files = 0;
        Object.values(this.tiles).forEach(t => {
            if (t.files) files += Object.keys(t.files).length;
        });
        const protectedCount = this.protectedTiles.size;
        
        document.getElementById('totalTiles').textContent = total;
        document.getElementById('onlineTiles').textContent = online;
        document.getElementById('filesCount').textContent = files;
        document.getElementById('protectedCount').textContent = protectedCount;
    },
    
    // ====== فتح لوحة المربع ======
    openPanel: function(id) {
        this.currentTile = id;
        const tile = this.tiles[id];
        if (!tile) return;
        
        const panel = document.getElementById('tilePanel');
        panel.classList.add('open');
        
        document.getElementById('panelTitle').textContent = `📦 المربع (${tile.row}, ${tile.col})`;
        document.getElementById('panelLocation').textContent = `(${tile.row}, ${tile.col})`;
        
        const isActive = this.activeServers.has(id);
        document.getElementById('panelStatus').textContent = isActive ? '🟢 نشط' : '⚪ غير نشط';
        document.getElementById('panelStatus').style.color = isActive ? '#4ade80' : '#888';
        
        const isProtected = this.protectedTiles.has(id);
        document.getElementById('panelProtected').textContent = isProtected ? '✅ محمي' : '❌ غير محمي';
        document.getElementById('panelProtected').style.color = isProtected ? '#4ade80' : '#f87171';
        
        document.getElementById('panelStartBtn').textContent = isActive ? '⏹️ إيقاف' : '▶️ تشغيل';
        document.getElementById('panelProtectBtn').textContent = isProtected ? '🔓 إزالة الحماية' : '🛡️ حماية';
        
        // عرض الملفات
        this.renderFiles(tile);
        
        document.getElementById('panelFileCount').textContent = tile.files ? Object.keys(tile.files).length : 0;
    },
    
    // ====== عرض الملفات ======
    renderFiles: function(tile) {
        const container = document.getElementById('panelFiles');
        container.innerHTML = '';
        
        if (!tile.files || Object.keys(tile.files).length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:11px;text-align:center;padding:10px;">📭 لا توجد ملفات</div>';
            return;
        }
        
        Object.entries(tile.files).forEach(([name, content]) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            const size = new Blob([content]).size;
            div.innerHTML = `
                <span class="name">${name}</span>
                <span class="size">${this.formatSize(size)}</span>
                <span class="actions">
                    <button onclick="System.editFile('${tile.id}', '${name}')" title="تحرير">✏️</button>
                    <button onclick="System.downloadFile('${tile.id}', '${name}')" title="تحميل">⬇️</button>
                    <button class="delete" onclick="System.deleteFile('${tile.id}', '${name}')" title="حذف">🗑️</button>
                </span>
            `;
            container.appendChild(div);
        });
    },
    
    formatSize: function(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    },
    
    // ====== إغلاق اللوحة ======
    closePanel: function() {
        document.getElementById('tilePanel').classList.remove('open');
        this.currentTile = null;
    },
    
    // ====== رفع ملف ======
    uploadFile: function() {
        if (!this.currentTile) return;
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const content = ev.target.result;
                const tile = this.tiles[this.currentTile];
                if (!tile.files) tile.files = {};
                tile.files[file.name] = content;
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                this.renderFiles(tile);
                this.showToast(`✅ تم رفع ${file.name}`);
            };
            reader.readAsText(file);
        };
        input.click();
    },
    
    // ====== تحرير ملف ======
    editFile: function(tileId, fileName) {
        this.currentTile = tileId;
        this.currentFile = fileName;
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        
        const editor = document.getElementById('fileEditor');
        editor.classList.add('open');
        document.getElementById('editorTitle').textContent = `📝 تحرير ${fileName}`;
        document.getElementById('editorContent').value = tile.files[fileName];
    },
    
    // ====== حفظ الملف ======
    saveFile: function() {
        if (!this.currentTile || !this.currentFile) return;
        const content = document.getElementById('editorContent').value;
        this.tiles[this.currentTile].files[this.currentFile] = content;
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.closeEditor();
        this.showToast(`✅ تم حفظ ${this.currentFile}`);
    },
    
    // ====== إغلاق المحرر ======
    closeEditor: function() {
        document.getElementById('fileEditor').classList.remove('open');
        this.currentFile = null;
    },
    
    // ====== تحميل ملف ======
    downloadFile: function(tileId, fileName) {
        const tile = this.tiles[tileId];
        if (!tile || !tile.files || !tile.files[fileName]) return;
        const blob = new Blob([tile.files[fileName]], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
    },
    
    // ====== حذف ملف ======
    deleteFile: function(tileId, fileName) {
        if (!confirm(`🗑️ حذف ${fileName}؟`)) return;
        const tile = this.tiles[tileId];
        if (tile && tile.files) {
            delete tile.files[fileName];
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.renderFiles(tile);
            this.showToast(`🗑️ تم حذف ${fileName}`);
        }
    },
    
    // ====== تشغيل/إيقاف الخادم ======
    toggleServer: function() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.activeServers.has(id)) {
            this.activeServers.delete(id);
            this.showToast('⏹️ تم إيقاف الخادم');
        } else {
            this.activeServers.add(id);
            // محاكاة تشغيل الخادم
            const tile = this.tiles[id];
            if (tile && tile.files && tile.files['main.js']) {
                try {
                    // تشغيل الكود في بيئة آمنة
                    const code = tile.files['main.js'];
                    // محاكاة التشغيل (فعلياً سنستخدم eval مع حماية)
                    console.log(`🟢 تشغيل خادم (${tile.row},${tile.col})`);
                    this.showToast(`🟢 تم تشغيل خادم (${tile.row},${tile.col})`);
                } catch(e) {
                    this.showToast('❌ خطأ في تشغيل الخادم');
                }
            } else {
                this.showToast('⚠️ لا يوجد ملف main.js');
                this.activeServers.delete(id);
            }
        }
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },
    
    // ====== حماية/إزالة الحماية ======
    toggleProtect: function() {
        if (!this.currentTile) return;
        const id = this.currentTile;
        if (this.protectedTiles.has(id)) {
            this.protectedTiles.delete(id);
            this.showToast('🔓 تم إزالة الحماية');
        } else {
            this.protectedTiles.add(id);
            this.showToast('🛡️ تم تفعيل الحماية');
        }
        this.saveTiles();
        this.renderGrid();
        this.updateStats();
        this.openPanel(id);
    },
    
    // ====== تفريغ المربع ======
    clearTile: function() {
        if (!this.currentTile) return;
        if (!confirm(`🗑️ تفريغ المربع (${this.currentTile})؟`)) return;
        const tile = this.tiles[this.currentTile];
        if (tile) {
            tile.files = {};
            this.activeServers.delete(this.currentTile);
            this.protectedTiles.delete(this.currentTile);
            this.saveTiles();
            this.renderGrid();
            this.updateStats();
            this.openPanel(this.currentTile);
            this.showToast('🗑️ تم تفريغ المربع');
        }
    },
    
    // ====== تصدير الكل ======
    exportAll: function() {
        const data = {
            tiles: this.tiles,
            protected: Array.from(this.protectedTiles),
            exported: Date.now(),
            version: '1.0'
        };
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `servers_backup_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('📤 تم تصدير جميع المربعات');
    },
    
    // ====== استيراد ======
    importAll: function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                this.tiles = data.tiles || this.tiles;
                this.protectedTiles = new Set(data.protected || []);
                this.saveTiles();
                this.renderGrid();
                this.updateStats();
                this.showToast('📥 تم استيراد المربعات');
            } catch(err) {
                this.showToast('❌ فشل الاستيراد: ' + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    },
    
    // ====== إعادة تعيين ======
    resetAll: function() {
        if (!confirm('⚠️ هل أنت متأكد من إعادة تعيين كل شيء؟')) return;
        localStorage.removeItem('mini_servers_tiles');
        localStorage.removeItem('mini_servers_protected');
        this.tiles = {};
        this.protectedTiles = new Set();
        this.activeServers = new Set();
        this.loadTiles();
        this.renderGrid();
        this.updateStats();
        this.closePanel();
        this.showToast('🔄 تم إعادة التعيين');
    },
    
    // ====== إشعار ======
    showToast: function(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
};
